<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina.WebApp</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
    <script>
        // Pre-load theme detection to prevent flash of wrong theme
        (function() {
            var theme = localStorage.getItem('lumina_theme');
            if (!theme) {
                theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();

        // Named function for Blazor JSInterop (CSP-safe, no eval needed)
        window.setLuminaTheme = function(theme) {
            document.documentElement.setAttribute('data-bs-theme', theme);
        };

        // Authenticated file download — fetches with JWT token and triggers browser download
        window.downloadFileWithAuth = async function(url, fallbackName) {
            var token = localStorage.getItem('lumina_token');
            if (!token) {
                alert('Not authenticated. Please log in again.');
                window.location.replace('/login');
                return false;
            }
            try {
                var resp = await fetch(url, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!resp.ok) {
                    alert('Download failed: ' + resp.status + ' ' + resp.statusText);
                    return false;
                }
                var blob = await resp.blob();
                // Extract filename from Content-Disposition header or use fallback
                var disposition = resp.headers.get('Content-Disposition');
                var filename = fallbackName || 'download';
                if (disposition) {
                    var match = disposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
                    if (match && match[1]) {
                        filename = match[1].replace(/['"]/g, '');
                    }
                }
                var blobUrl = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
                return true;
            } catch (err) {
                alert('Download error: ' + err.message);
                return false;
            }
        };
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // Auth guard: redirect to /login if no token (before Blazor loads)
        (function() {
            var path = window.location.pathname;
            if (path !== '/login' && !localStorage.getItem('lumina_token')) {
                window.location.replace('/login');
            }
        })();
    </script>
    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
