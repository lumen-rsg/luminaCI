<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina CI</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!--
      app.js runs before the stylesheets: it applies the stored theme to avoid a
      flash of the wrong theme, and registers the window.* entry points Blazor
      calls via JS interop (setLuminaTheme, connectBuildLogStream,
      downloadFileWithAuth). Keeping it external lets us ship a strict CSP with
      NO 'unsafe-inline' for script-src (SEC-05).
    -->
    <script src="js/app.js"></script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!--
      The import map is the only inline script on the page, and .NET 10 Blazor
      needs it to resolve "dotnet.js" → the content-hashed "dotnet.<hash>.js".
      dotnet publish populates this tag at build time — but ONLY if it matches the
      exact placeholder "<script type=\"importmap\"></script>". Do NOT add any
      attribute (e.g. nonce=) here: it breaks the SDK's tag match and leaves the
      map empty, so Blazor fails with "error loading dynamically imported module:
      dotnet.js".

      CSP compliance is handled at the edge instead: nginx injects a per-request
      nonce attribute into this tag via sub_filter and emits the same nonce in the
      Content-Security-Policy header (deploy/nginx/conf.d/console.conf). That keeps
      'unsafe-inline' out of script-src without fighting the SDK.
    -->
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <a href="" class="dismiss">&#x2715;</a>
    </div>
    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
