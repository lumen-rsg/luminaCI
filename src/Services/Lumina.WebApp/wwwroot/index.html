<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina CI</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!--
      app.js runs before the stylesheets: it applies the stored theme to avoid a
      flash of the wrong theme, and registers the window.* entry points Blazor
      calls via JS interop (setLuminaTheme, connectBuildLogStream,
      downloadFileWithAuth). Keeping it external lets us ship a strict CSP with
      NO 'unsafe-inline' for script-src (SEC-05).
    -->
    <script src="js/app.js"></script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!--
      The import map is the only inline script on the page. .NET 10 Blazor
      WebAssembly injects it at runtime. A strict CSP blocks inline scripts, so
      nginx substitutes __CSP_NONCE__ with a per-request nonce and adds the same
      nonce to the Content-Security-Policy header (deploy/nginx/conf.d/console.conf).
    -->
    <script type="importmap" nonce="__CSP_NONCE__"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <a href="" class="dismiss">&#x2715;</a>
    </div>
    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
