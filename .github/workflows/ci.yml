name: ci

# Validate application code, deployment topology, production images, durable
# infrastructure, and the complete RPM lifecycle on every protected branch.

on:
  push:
    branches: [ staging, main ]
  pull_request:
    branches: [ staging, main ]

permissions:
  contents: read
  checks: write

jobs:
  deployment-validation:
    name: deployment & shell validation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Lint shell entrypoints
        run: shellcheck --severity=warning scripts/*.sh tests/ci/*.sh

      - name: Lint workflow definitions
        run: |
          docker run --rm \
            --volume "${PWD}:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint:1.7.7

      - name: Validate Compose and Dockerfiles
        run: tests/ci/validate-deployment.sh

      - name: Validate observability stack
        run: tests/ci/observability-stack.sh

      - name: Test environment initializer
        run: tests/ci/init-env.sh

      - name: Test production preflight
        run: tests/ci/production-preflight.sh

      - name: Test production monitoring alerts
        run: tests/ci/monitoring-alerts.sh

      - name: Scan deployment configuration
        run: |
          docker run --rm \
            --volume "${PWD}:/workspace:ro" \
            aquasec/trivy:0.72.0 config \
            --exit-code 1 \
            --severity CRITICAL \
            /workspace/deploy

  build-and-test:
    name: application & browser tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # Match the SDK the rest of the toolchain targets. The solution uses
    # net10.0 + EF Core 10.0.0-preview.3, which requires the .NET 10 SDK.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            src/Services/Lumina.WebApp/package-lock.json
            src/Websites/Lumina.Linux/package-lock.json
            src/Websites/Lumina.Packages/package-lock.json
            tests/Lumina.WebApp.E2E/package-lock.json

      - name: Restore
        run: dotnet restore "Lumina CI.sln"

      - name: Audit dependencies
        shell: bash
        run: |
          dotnet package list --project "Lumina CI.sln" \
            --vulnerable \
            --include-transitive \
            --format json \
            --no-restore > vulnerable-packages.json

          vulnerable_count="$(
            jq '[
              .projects[]?.frameworks[]?
              | ((.topLevelPackages // []) + (.transitivePackages // []))[]?
              | select((.vulnerabilities // []) | length > 0)
            ] | length' vulnerable-packages.json
          )"

          if [[ "$vulnerable_count" -gt 0 ]]; then
            jq '[
              .projects[] as $project
              | $project.frameworks[]?
              | ((.topLevelPackages // []) + (.transitivePackages // []))[]?
              | select((.vulnerabilities // []) | length > 0)
              | { project: $project.path, package: .id, version: .resolvedVersion, vulnerabilities: .vulnerabilities }
            ]' vulnerable-packages.json
            exit 1
          fi

      - name: Build
        run: dotnet build "Lumina CI.sln" -c Release --no-restore

      - name: Test
        run: dotnet test "Lumina CI.sln" -c Release --no-build --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal"

      - name: Build and audit React frontend
        working-directory: src/Services/Lumina.WebApp
        run: |
          npm ci
          npm run build
          npm audit --omit=dev

      - name: Test, build, and audit packages portal
        working-directory: src/Websites/Lumina.Packages
        run: |
          npm ci
          npm test
          npm run build
          npm audit --omit=dev

      - name: Test, build, and audit Lumina Linux site
        working-directory: src/Websites/Lumina.Linux
        run: |
          npm ci
          npm test
          npm run build
          npm audit --omit=dev

      - name: Install browser accessibility tests
        working-directory: tests/Lumina.WebApp.E2E
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser accessibility tests
        working-directory: tests/Lumina.WebApp.E2E
        run: npm test

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

      - name: Publish browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tests/Lumina.WebApp.E2E/test-results
          if-no-files-found: ignore

  production-images:
    name: image ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            dockerfile: deploy/docker/Lumina.ApiGateway.Dockerfile
            trivy: true
          - name: build-service
            dockerfile: deploy/docker/Lumina.BuildService.Dockerfile
            trivy: true
          - name: repository-service
            dockerfile: deploy/docker/Lumina.RepositoryService.Dockerfile
            trivy: true
          - name: scanner-service
            dockerfile: deploy/docker/Lumina.ScannerService.Dockerfile
            trivy: true
          - name: security-service
            dockerfile: deploy/docker/Lumina.SecurityService.Dockerfile
            trivy: true
          - name: source-service
            dockerfile: deploy/docker/Lumina.SourceService.Dockerfile
            trivy: true
          - name: webapp
            dockerfile: deploy/docker/Lumina.WebApp.Dockerfile
            trivy: true
          - name: packages-web
            dockerfile: deploy/docker/Lumina.Packages.Dockerfile
            trivy: true
          - name: linux-web
            dockerfile: deploy/docker/Lumina.Linux.Dockerfile
            trivy: true
          - name: dotnet-build-runner
            dockerfile: deploy/docker/dotnet-build.Dockerfile
            trivy: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build \
            --tag "lumina-ci/${{ matrix.name }}:${GITHUB_SHA}" \
            --file "${{ matrix.dockerfile }}" \
            .

      - name: Inspect production image
        run: |
          docker image inspect \
            "lumina-ci/${{ matrix.name }}:${GITHUB_SHA}" \
            > image-inspect.json
          jq -e '
            .[0]
            | (.Id | length > 0)
              and (.Architecture | length > 0)
              and (((.Config.Entrypoint // []) + (.Config.Cmd // [])) | length > 0)
          ' image-inspect.json

      - name: Scan production image
        if: matrix.trivy
        run: |
          docker run --rm \
            --security-opt label=disable \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume trivy-cache:/root/.cache \
            aquasec/trivy:0.72.0 image \
            --ignore-unfixed \
            --quiet \
            --scanners vuln \
            --severity CRITICAL \
            --format json \
            "lumina-ci/${{ matrix.name }}:${GITHUB_SHA}" \
            > trivy.json

          jq '[
            .Results[]? as $result
            | $result.Vulnerabilities[]?
            | select(.Severity == "CRITICAL")
            | {
                target: $result.Target,
                id: .VulnerabilityID,
                package: .PkgName,
                installed: .InstalledVersion,
                fixed: .FixedVersion
              }
          ]' trivy.json

          jq -e '
            (.Results | type == "array")
            and (.Results | length > 0)
            and ([
              .Results[]?.Vulnerabilities[]?
              | select(.Severity == "CRITICAL")
            ] | length == 0)
          ' trivy.json

      # Trivy 0.72 does not provide Fedora 44 OS vulnerability records. Treating
      # its empty report as a clean scan would recreate the false-confidence
      # problem this workflow prevents, so the pinned runner gets an explicit
      # identity/release check while service images remain Trivy-gated.
      - name: Verify pinned Fedora build runner
        if: ${{ !matrix.trivy }}
        run: |
          test "$(
            docker image inspect \
              "lumina-ci/${{ matrix.name }}:${GITHUB_SHA}" \
              --format '{{ index .Config.Labels "io.lumina.build.distribution" }}-{{ index .Config.Labels "io.lumina.build.release" }}'
          )" = "fedora-44"

  infrastructure-durability:
    name: infrastructure restart durability
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    needs: deployment-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify durable infrastructure
        run: tests/ci/infrastructure-durability.sh

      - name: Verify infrastructure backup restoration
        run: tests/ci/backup-restore.sh

  compose-smoke:
    name: complete Compose application smoke test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    needs: deployment-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start and smoke-test the complete application
        run: tests/ci/compose-smoke.sh

  rpm-lifecycle:
    name: rpm build, sign, publish & install
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    needs: deployment-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate RPM lifecycle
        run: tests/ci/rpm-lifecycle.sh

  required-ci-gate:
    name: required CI gate
    runs-on: ubuntu-24.04-arm
    if: always()
    needs:
      - deployment-validation
      - build-and-test
      - production-images
      - infrastructure-durability
      - compose-smoke
      - rpm-lifecycle
    steps:
      - name: Require every validation layer
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -e '
            [.[] | .result]
            | length == 6 and all(. == "success")
          ' <<<"$NEEDS_JSON"
