name: ci

# Build + test the whole solution on every push and pull request.
#
# This is the gate that catches regressions in the security-critical
# components — ProcessArgumentSanitizer, WebhookSignatureVerifier,
# ConfigParserService, and PipelineEngine — before they reach staging.
# The unit tests here are intentionally infrastructure-free (no Docker,
# RabbitMQ, Redis, or Postgres required) so they run fast and deterministically
# in CI exactly as they do locally.

on:
  push:
    branches: [ staging, main ]
  pull_request:
    branches: [ staging, main ]

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: build & test (net10.0)
    runs-on: ubuntu-24.04-arm
    # Match the SDK the rest of the toolchain targets. The solution uses
    # net10.0 + EF Core 10.0.0-preview.3, which requires the .NET 10 SDK.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "Lumina CI.sln"

      - name: Audit dependencies
        shell: bash
        run: |
          dotnet package list --project "Lumina CI.sln" \
            --vulnerable \
            --include-transitive \
            --format json \
            --no-restore > vulnerable-packages.json

          vulnerable_count="$(
            jq '[
              .projects[]?.frameworks[]?
              | ((.topLevelPackages // []) + (.transitivePackages // []))[]?
              | select((.vulnerabilities // []) | length > 0)
            ] | length' vulnerable-packages.json
          )"

          if [[ "$vulnerable_count" -gt 0 ]]; then
            jq '[
              .projects[] as $project
              | $project.frameworks[]?
              | ((.topLevelPackages // []) + (.transitivePackages // []))[]?
              | select((.vulnerabilities // []) | length > 0)
              | { project: $project.path, package: .id, version: .resolvedVersion, vulnerabilities: .vulnerabilities }
            ]' vulnerable-packages.json
            exit 1
          fi

      - name: Build
        run: dotnet build "Lumina CI.sln" -c Release --no-restore

      - name: Test
        run: dotnet test "Lumina CI.sln" -c Release --no-build --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
