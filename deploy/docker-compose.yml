services:
  # === Infrastructure ===
  postgres:
    image: postgres:16-alpine
    container_name: lumina-postgres
    environment:
      POSTGRES_DB: lumina_ci
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (see deploy/.env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d lumina_ci"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumina-network

  redis:
    image: redis:7-alpine
    container_name: lumina-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumina-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lumina-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: lumina
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env (see deploy/.env.example)}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - lumina-network

  minio:
    image: minio/minio:latest
    container_name: lumina-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-luminaadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD must be set in .env (see deploy/.env.example)}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumina-network

  # === Application Services ===
  api-gateway:
    build:
      context: ../
      dockerfile: deploy/docker/Lumina.ApiGateway.Dockerfile
    container_name: lumina-api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=lumina_ci;Username=lumina;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (see deploy/.env.example)}
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=lumina
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env (see deploy/.env.example)}
      - Services__BuildService=http://build-service:5001
      - Services__SecurityService=http://security-service:5002
      - Services__ScannerService=http://scanner-service:5003
      - Services__RepositoryService=http://repository-service:5004
      - Services__SourceService=http://source-service:5006
      - Ldap__Host=${LDAP_HOST:-localhost}
      - Ldap__Port=${LDAP_PORT:-389}
      - Ldap__BaseDn=${LDAP_BASE_DN:-dc=lumina,dc=1t,dc=ru}
      - Ldap__BindDn=${LDAP_BIND_DN:-cn=admin,dc=lumina,dc=1t,dc=ru}
      - Ldap__BindPassword=${LDAP_BIND_PASSWORD:-}
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars; see deploy/.env.example)}
      - Jwt__Issuer=LuminaCI
      - Jwt__Audience=LuminaCI
      - Jwt__AccessMinutes=${JWT_ACCESS_MINUTES:-15}
      - Jwt__RefreshHours=${JWT_REFRESH_HOURS:-8}
      - Jwt__CookieSecure=${JWT_COOKIE_SECURE:-true}
      - Auth__AdminUsername=${ADMIN_USERNAME:-admin}
      - Auth__AdminPassword=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env (see deploy/.env.example)}
      - Auth__DeveloperUsername=${DEVELOPER_USERNAME:-developer}
      - Auth__DeveloperPassword=${DEVELOPER_PASSWORD:-}
      - Auth__MaxFailedLogins=${AUTH_MAX_FAILED_LOGINS:-5}
      - Auth__LockoutMinutes=${AUTH_LOCKOUT_MINUTES:-15}
      - Auth__MaxLockoutMinutes=${AUTH_MAX_LOCKOUT_MINUTES:-1440}
      - RateLimit__Global__PermitLimit=${RATE_LIMIT_GLOBAL_PERMIT:-100}
      - RateLimit__Global__TokensPerSecond=${RATE_LIMIT_GLOBAL_TPS:-100}
      - RateLimit__Global__QueueLimit=${RATE_LIMIT_GLOBAL_QUEUE:-10}
      - RateLimit__Login__PermitLimit=${RATE_LIMIT_LOGIN_PERMIT:-5}
      - RateLimit__Login__TokensPerSecond=${RATE_LIMIT_LOGIN_TPS:-5}
      - RateLimit__Login__QueueLimit=${RATE_LIMIT_LOGIN_QUEUE:-0}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - lumina-network

  build-service:
    build:
      context: ../
      dockerfile: deploy/docker/Lumina.BuildService.Dockerfile
    container_name: lumina-build-service
    # NOTE: runs as the non-root `app` user baked into the image (USER app).
    # Do NOT override `user:` to root here — that would re-expose the daemon.
    # Docker access goes through docker-socket-proxy (a read/filtered HAProxy in
    # front of the host socket) instead of a raw socket mount, so a compromised
    # build-service can only call the whitelisted Docker API endpoints the proxy
    # exposes (containers create/start/logs/wait/stop/remove + images list/create).
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=lumina_ci;Username=lumina;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (see deploy/.env.example)}
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=lumina
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env (see deploy/.env.example)}
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_USER:-luminaadmin}
      - MinIO__SecretKey=${MINIO_PASSWORD:?MINIO_PASSWORD must be set in .env (see deploy/.env.example)}
      # Docker daemon reached via the socket-proxy container below (not the raw socket).
      - Docker__SocketPath=http://docker-socket-proxy:2375
      # Untrusted build-container isolation knobs (see DockerBuildService.cs).
      - Docker__BuildNetwork=${BUILD_NETWORK:-lumina-buildnet}
      - Docker__BuildMemoryBytes=${BUILD_MEMORY_BYTES:-2147483648}
      - Docker__BuildPidsLimit=${BUILD_PIDS_LIMIT:-512}
      - Docker__BuildCpuQuota=${BUILD_CPU_QUOTA:-150000}
      - Services__SecurityService=http://security-service:5002
      # Shared JWT secret + issuer/audience so build-service can independently
      # re-validate bearer tokens (defense-in-depth) — see SEC-04. The internal
      # port (5001) is intentionally NOT published to the host: the service must
      # only be reachable from inside lumina-network, via the api-gateway.
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars; see deploy/.env.example)}
      - Jwt__Issuer=LuminaCI
      - Jwt__Audience=LuminaCI
    volumes:
      - /opt/lumina/builds:/app/builds
      - /opt/lumina/sources:/opt/lumina/sources:z
      - /opt/lumina/extra-sources:/opt/lumina/extra-sources:z
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    networks:
      - lumina-network
      - lumina-buildnet
      - proxy-net

  # Least-privilege Docker API gateway. The host socket is mounted here, but this
  # container only forwards explicitly enabled endpoints to build-service. If
  # build-service is compromised it cannot `docker run` arbitrary images, attach
  # to other containers, or read the host filesystem through the socket.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: lumina-docker-socket-proxy
    environment:
      # Only the API surfaces build-service needs; everything else stays off.
      CONTAINERS: "1"   # create/start/logs/wait/stop/remove build containers
      IMAGES: "1"        # list images + pull missing build images
      POST: "1"          # allow create/start/pull (mutations)
      # Explicitly denied — reduces blast radius:
      EXEC: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      SERVICES: "0"
      TASKS: "0"
      SECRETS: "0"
      CONFIGS: "0"
      SYSTEM: "0"
      INFO: "1"
      AUTH: "0"
      BUILD: "0"
      SWARM: "0"
      DISTRIBUTION: "0"
      PLUGINS: "0"
      SESSION: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped
    networks:
      - proxy-net

  security-service:
    build:
      context: ../
      dockerfile: deploy/docker/Lumina.SecurityService.Dockerfile
    container_name: lumina-security-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5002
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=lumina_ci;Username=lumina;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (see deploy/.env.example)}
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=lumina
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env (see deploy/.env.example)}
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_USER:-luminaadmin}
      - MinIO__SecretKey=${MINIO_PASSWORD:?MINIO_PASSWORD must be set in .env (see deploy/.env.example)}
      - Gpg__KeyStorePath=/app/keys
      - Gpg__Passphrase=${GPG_PASSPHRASE:?GPG_PASSPHRASE must be set in .env (see deploy/.env.example)}
      - Services__BuildService=http://build-service:5001
      # Shared JWT config so security-service can re-validate bearer tokens
      # (defense-in-depth) — see SEC-04. Internal port 5002 is NOT published.
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars; see deploy/.env.example)}
      - Jwt__Issuer=LuminaCI
      - Jwt__Audience=LuminaCI
    volumes:
      - gpg_keys:/app/keys
      - gpg_gnupghome:/app/.gnupg
      - /opt/lumina/builds:/app/builds:z
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - lumina-network

  scanner-service:
    build:
      context: ../
      dockerfile: deploy/docker/Lumina.ScannerService.Dockerfile
    container_name: lumina-scanner-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5003
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=lumina_ci;Username=lumina;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (see deploy/.env.example)}
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=lumina
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env (see deploy/.env.example)}
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_USER:-luminaadmin}
      - MinIO__SecretKey=${MINIO_PASSWORD:?MINIO_PASSWORD must be set in .env (see deploy/.env.example)}
      - Trivy__ServerUrl=http://trivy:8080
      # Shared JWT config so scanner-service can re-validate bearer tokens
      # (defense-in-depth) — see SEC-04. Internal port 5003 is NOT published.
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars; see deploy/.env.example)}
      - Jwt__Issuer=LuminaCI
      - Jwt__Audience=LuminaCI
    user: "root"
    volumes:
      - /opt/lumina/builds:/app/builds:z
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - lumina-network

  trivy:
    image: aquasec/trivy:latest
    container_name: lumina-trivy
    command: server --listen :8080
    ports:
      - "8081:8080"
    volumes:
      - trivy_cache:/root/.cache/trivy
      - /opt/lumina/builds:/app/builds:z
    networks:
      - lumina-network

  repository-service:
    build:
      context: ../
      dockerfile: deploy/docker/Lumina.RepositoryService.Dockerfile
    container_name: lumina-repository-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5004
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=lumina_ci;Username=lumina;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (see deploy/.env.example)}
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=lumina
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env (see deploy/.env.example)}
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_USER:-luminaadmin}
      - MinIO__SecretKey=${MINIO_PASSWORD:?MINIO_PASSWORD must be set in .env (see deploy/.env.example)}
      - Repository__BasePath=/app/repos
      # Shared JWT config so repository-service can re-validate bearer tokens
      # (defense-in-depth) — see SEC-04. Internal port 5004 is NOT published.
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars; see deploy/.env.example)}
      - Jwt__Issuer=LuminaCI
      - Jwt__Audience=LuminaCI
    volumes:
      - repo_data:/app/repos
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - lumina-network

  source-service:
    build:
      context: ../
      dockerfile: deploy/docker/Lumina.SourceService.Dockerfile
    container_name: lumina-source-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5006
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=lumina_ci;Username=lumina;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (see deploy/.env.example)}
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=lumina
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env (see deploy/.env.example)}
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_USER:-luminaadmin}
      - MinIO__SecretKey=${MINIO_PASSWORD:?MINIO_PASSWORD must be set in .env (see deploy/.env.example)}
      - Source__ConfigPath=/app/conf.ini
      - Source__MaxRetries=3
      - Source__FetchTimeoutMinutes=30
      - Source__TempDir=/tmp/source-fetch
      - Source__SourcesDir=/opt/lumina/sources
      - Services__BuildService=http://build-service:5001
      # Shared JWT config so source-service can re-validate bearer tokens
      # (defense-in-depth) — see SEC-04. Internal port 5006 is NOT published.
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars; see deploy/.env.example)}
      - Jwt__Issuer=LuminaCI
      - Jwt__Audience=LuminaCI
    volumes:
      - ../conf.ini:/app/conf.ini:ro,z
      - ../Test:/app/Test:ro,z
      - source_temp:/tmp/source-fetch
      - /opt/lumina/sources:/opt/lumina/sources:z
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - lumina-network

  webapp:
    build:
      context: ../
      dockerfile: deploy/docker/Lumina.WebApp.Dockerfile
    container_name: lumina-webapp
    ports:
      - "5005:80"
    depends_on:
      - api-gateway
    networks:
      - lumina-network

  # === Build Images (pre-built, used by build-service for RPM containers) ===
  # These build the Docker images and exit — the images are then used by build-service
  # to spin up ephemeral build containers.
  rpm-build-image:
    build:
      context: ../
      dockerfile: deploy/docker/rpm-build.Dockerfile
    image: lumina-rpm-build:latest
    restart: "no"
    entrypoint: ["true"]

  dotnet-build-image:
    build:
      context: ../
      dockerfile: deploy/docker/dotnet-build.Dockerfile
    image: lumina-dotnet-build:latest
    restart: "no"
    entrypoint: ["true"]

  nginx:
    image: nginx:alpine
    container_name: lumina-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ../deploy/nginx/conf.d:/etc/nginx/conf.d:ro,z
      - repo_data:/srv/packages:ro
    depends_on:
      - api-gateway
      - webapp
    networks:
      - lumina-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  gpg_keys:
  gpg_gnupghome:
  trivy_cache:
  repo_data:
  source_temp:

networks:
  lumina-network:
    driver: bridge
  # Dedicated bridge for untrusted build containers. It is intentionally a
  # SEPARATE network from lumina-network: build containers (rpm-build, dotnet-build)
  # are attached here so they cannot reach Postgres/RabbitMQ/MinIO/Trivy/other
  # services directly — they only get outbound internet (for dnf builddep / git
  # clone) and a path back to build-service via build-service's own attachment.
  lumina-buildnet:
    driver: bridge
  # Two-party network: only build-service and docker-socket-proxy. Isolates the
  # socket-exposing proxy from every other service.
  proxy-net:
    driver: bridge