services:
  # === Infrastructure ===
  postgres:
    image: postgres:16-alpine
    container_name: lumina-postgres
    environment:
      POSTGRES_DB: lumina_ci
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (see deploy/.env.example)}
    # SEC-01: NOT published to the host. App services connect over lumina-network
    # via the `postgres` DNS name. Publishing 5432 lets anyone on the network
    # read/write the CI database using the .env password. Inspect via
    # `docker exec lumina-postgres psql ...` or an admin VPN instead.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d lumina_ci"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumina-network

  redis:
    image: redis:7-alpine
    container_name: lumina-redis
    # SEC-01: NOT published to the host. App services connect over lumina-network
    # via the `redis` DNS name. Publishing 6379 lets anyone on the network flush
    # queues / read cache. Inspect via `docker exec lumina-redis redis-cli`.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumina-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lumina-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: lumina
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env (see deploy/.env.example)}
    # SEC-01: AMQP (5672) and management UI (15672) NOT published to the host.
    # App services connect over lumina-network via the `rabbitmq` DNS name.
    # Publishing lets anyone on the network purge queues or log into the
    # management UI with the .env default password. Inspect via
    # `docker exec lumina-rabbitmq rabbitmqadmin ...` or an admin VPN.
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - lumina-network

  minio:
    # Pinned to a specific RELEASE tag (not :latest) so a spec building today
    # does not break tomorrow when MinIO ships a new release. Update
    # deliberately; verify the new tag is multi-arch (amd64+arm64) before bump.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: lumina-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-luminaadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD must be set in .env (see deploy/.env.example)}
    command: server /data --console-address ":9001"
    # SEC-01: S3 API (9000) and console (9001) NOT published to the host. App
    # services connect over lumina-network via the `minio` DNS name. Publishing
    # lets anyone on the network read/drop build artifacts. Inspect via
    # `docker exec lumina-minio mc ...` or an admin VPN.
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumina-network

  # Establish the shared service/builder GID and setgid permissions before any
  # application container touches the bind-mounted build workspace.
  volume-init:
    image: alpine:3.22
    container_name: lumina-volume-init
    user: "0:0"
    command:
      - /bin/sh
      - -euc
      - |
        chown -R 1654:1654 /volumes/builds /volumes/sources /volumes/extra-sources
        find /volumes/builds /volumes/sources /volumes/extra-sources -type d -exec chmod 2770 {} +
        find /volumes/builds /volumes/sources /volumes/extra-sources -type f -exec chmod 0660 {} +
    volumes:
      - /opt/lumina/builds:/volumes/builds:z
      - /opt/lumina/sources:/volumes/sources:z
      - /opt/lumina/extra-sources:/volumes/extra-sources:z
    restart: "no"

  # === Application Services ===
  api-gateway:
    image: ${API_GATEWAY_IMAGE:-lumina-api-gateway:local}
    build:
      context: ../
      dockerfile: deploy/docker/Lumina.ApiGateway.Dockerfile
    container_name: lumina-api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=lumina_ci;Username=lumina;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (see deploy/.env.example)}
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=lumina
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env (see deploy/.env.example)}
      - Services__BuildService=http://build-service:5001
      - Services__SecurityService=http://security-service:5002
      - Services__ScannerService=http://scanner-service:5003
      - Services__RepositoryService=http://repository-service:5004
      - Services__SourceService=http://source-service:5006
      - Ldap__Host=${LDAP_HOST:-localhost}
      - Ldap__Port=${LDAP_PORT:-389}
      - Ldap__BaseDn=${LDAP_BASE_DN:-dc=lumina,dc=1t,dc=ru}
      - Ldap__BindDn=${LDAP_BIND_DN:-cn=admin,dc=lumina,dc=1t,dc=ru}
      - Ldap__BindPassword=${LDAP_BIND_PASSWORD:-}
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars; see deploy/.env.example)}
      - Jwt__Issuer=LuminaCI
      - Jwt__Audience=LuminaCI
      - Jwt__AccessMinutes=${JWT_ACCESS_MINUTES:-15}
      - Jwt__RefreshHours=${JWT_REFRESH_HOURS:-8}
      - Jwt__CookieSecure=${JWT_COOKIE_SECURE:-true}
      - Auth__AdminUsername=${ADMIN_USERNAME:-admin}
      - Auth__AdminPassword=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env (see deploy/.env.example)}
      - Auth__DeveloperUsername=${DEVELOPER_USERNAME:-developer}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - Auth__DeveloperPassword=${DEVELOPER_PASSWORD:-}
      - Auth__MaxFailedLogins=${AUTH_MAX_FAILED_LOGINS:-5}
      - Auth__LockoutMinutes=${AUTH_LOCKOUT_MINUTES:-15}
      - Auth__MaxLockoutMinutes=${AUTH_MAX_LOCKOUT_MINUTES:-1440}
      - RateLimit__Global__PermitLimit=${RATE_LIMIT_GLOBAL_PERMIT:-100}
      - RateLimit__Global__TokensPerSecond=${RATE_LIMIT_GLOBAL_TPS:-100}
      - RateLimit__Global__QueueLimit=${RATE_LIMIT_GLOBAL_QUEUE:-10}
      - RateLimit__Login__PermitLimit=${RATE_LIMIT_LOGIN_PERMIT:-5}
      - RateLimit__Login__TokensPerSecond=${RATE_LIMIT_LOGIN_TPS:-5}
      - RateLimit__Login__QueueLimit=${RATE_LIMIT_LOGIN_QUEUE:-0}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:5000/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - lumina-network

  build-service:
    image: ${BUILD_SERVICE_IMAGE:-lumina-build-service:local}
    build:
      context: ../
      dockerfile: deploy/docker/Lumina.BuildService.Dockerfile
    container_name: lumina-build-service
    # NOTE: runs as the non-root `app` user baked into the image (USER app).
    # Do NOT override `user:` to root here — that would re-expose the daemon.
    # Docker access goes through docker-socket-proxy (a read/filtered HAProxy in
    # front of the host socket) instead of a raw socket mount, so a compromised
    # build-service can only call the whitelisted Docker API endpoints the proxy
    # exposes (containers create/start/logs/wait/stop/remove + images list/create).
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=lumina_ci;Username=lumina;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (see deploy/.env.example)}
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=lumina
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env (see deploy/.env.example)}
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_USER:-luminaadmin}
      - MinIO__SecretKey=${MINIO_PASSWORD:?MINIO_PASSWORD must be set in .env (see deploy/.env.example)}
      # Kubernetes runners receive presigned URLs for this single controlled
      # HTTPS origin; they never receive the MinIO credentials above.
      - MinIO__RunnerEndpoint=${KUBERNETES_RUNNER_ENDPOINT:-packages.lumina.1t.ru:443}
      - MinIO__RunnerUseSSL=true
      - Kubernetes__Network__EgressCidr=${KUBERNETES_BUILD_EGRESS_CIDR:-146.120.224.52/32}
      - Kubernetes__Network__HttpsPort=443
      - Kubernetes__Network__FedoraRepositoryBaseUrl=${KUBERNETES_FEDORA_BASE_URL:-https://packages.lumina.1t.ru/fedora}
      - BuildExecutor__Type=${BUILD_EXECUTOR_TYPE:-Docker}
      - Kubernetes__Enabled=${KUBERNETES_ENABLED:-false}
      - Kubernetes__Namespace=${KUBERNETES_NAMESPACE:-lumina-builds}
      - Kubernetes__RunnerImages__fedora-44-x86_64=${KUBERNETES_RUNNER_IMAGE_X86_64:-registry.lumina.1t.ru/lumina-rpm-build@sha256:bf922922445bdb4cddc0f1feb2dc3fe519335ef59d18b6866d09c5a647f46149}
      - Kubernetes__RunnerImages__fedora-44-aarch64=${KUBERNETES_RUNNER_IMAGE_AARCH64:-registry.lumina.1t.ru/lumina-rpm-build@sha256:72a1e05e7a9b13a421e4ff8090c3fbaf1762148fa8073d9fface726826d32a97}
      - KUBECONFIG=/run/secrets/kubernetes-build-controller.kubeconfig
      # Docker daemon reached via the socket-proxy container below (not the raw socket).
      - Docker__SocketPath=http://docker-socket-proxy:2375
      # Untrusted build-container isolation knobs (see DockerBuildService.cs).
      - Docker__BuildNetwork=${BUILD_NETWORK:-lumina-buildnet}
      - Docker__HostDataRoot=${HOST_DATA_ROOT:-/opt/lumina}
      - Docker__BuildMemoryBytes=${BUILD_MEMORY_BYTES:-2147483648}
      - Docker__BuildPidsLimit=${BUILD_PIDS_LIMIT:-512}
      - Docker__BuildCpuQuota=${BUILD_CPU_QUOTA:-150000}
      - Docker__AllowedBuildImages__0=${RPM_BUILD_IMAGE:-lumina-rpm-build:f44-v1}
      - Docker__AllowedBuildImages__1=${DOTNET_BUILD_IMAGE:-lumina-dotnet-build:f44-v1}
      - Docker__AllowedBuildImages__2=${RPM_AARCH64_BUILD_IMAGE:-lumina-rpm-build:f44-aarch64-v1}
      - Services__SecurityService=http://security-service:5002
      # Shared JWT secret + issuer/audience so build-service can independently
      # re-validate bearer tokens (defense-in-depth) — see SEC-04. The internal
      # port (5001) is intentionally NOT published to the host: the service must
      # only be reachable from inside lumina-network, via the api-gateway.
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars; see deploy/.env.example)}
      - Jwt__Issuer=LuminaCI
      - Jwt__Audience=LuminaCI
      # SEC-013: master key for at-rest encryption of pipeline secrets
      # (WebhookSecret, GitToken). Required — build-service refuses to start
      # without it. NEVER change it after secrets are written, or they become
      # undecryptable.
      - Secrets__MasterKey=${SECRETS_MASTER_KEY:?SECRETS_MASTER_KEY must be set in .env (see deploy/.env.example)}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - /opt/lumina/builds:/app/builds
      - /opt/lumina/builds:/opt/lumina/builds:z
      - /opt/lumina/sources:/opt/lumina/sources:z
      - /opt/lumina/extra-sources:/opt/lumina/extra-sources:z
      - ${KUBERNETES_KUBECONFIG_FILE:-./secrets/kubernetes-build-controller.kubeconfig}:/run/secrets/kubernetes-build-controller.kubeconfig:ro,z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
      rpm-build-image:
        condition: service_completed_successfully
      dotnet-build-image:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:5001/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lumina-network
      - lumina-buildnet
      - proxy-net

  # Least-privilege Docker API gateway. The host socket is mounted here, but this
  # container only forwards explicitly enabled endpoints to build-service. If
  # build-service is compromised it cannot `docker run` arbitrary images, attach
  # to other containers, or read the host filesystem through the socket.
  docker-socket-proxy:
    # Pinned: docker-socket-proxy has no 0.4 rolling tag, and 0.3 points at the
    # stale 0.3.0. Fix to a specific patch release; verify multi-arch before bump.
    # Note: upstream tags are v-prefixed (v0.4.2), multi-arch incl. arm64.
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: lumina-docker-socket-proxy
    environment:
      # Only the API surfaces build-service needs; everything else stays off.
      CONTAINERS: "1"   # create/start/logs/wait/stop/remove build containers
      IMAGES: "1"        # list/inspect images + pull missing build images
      POST: "1"          # allow create/start/pull (mutations)
      # Explicitly denied — reduces blast radius:
      EXEC: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      SERVICES: "0"
      TASKS: "0"
      SECRETS: "0"
      CONFIGS: "0"
      SYSTEM: "0"
      INFO: "1"
      PING: "1"
      AUTH: "0"
      BUILD: "0"
      SWARM: "0"
      DISTRIBUTION: "0"
      PLUGINS: "0"
      SESSION: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    # The proxy's entrypoint generates its HAProxy config in /tmp at startup
    # (docker-entrypoint.sh → /tmp/haproxy.cfg), so /tmp must be writable even
    # though the rootfs is read-only. Mount it as tmpfs alongside /run.
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
      # The proxy must open the host's Docker socket on SELinux hosts. Its API
      # allowlist, read-only rootfs, and dropped capabilities remain enforced.
      - label=disable
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped
    networks:
      - proxy-net

  security-service:
    image: ${SECURITY_SERVICE_IMAGE:-lumina-security-service:local}
    build:
      context: ../
      dockerfile: deploy/docker/Lumina.SecurityService.Dockerfile
    container_name: lumina-security-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5002
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=lumina_ci;Username=lumina;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (see deploy/.env.example)}
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=lumina
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env (see deploy/.env.example)}
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_USER:-luminaadmin}
      - MinIO__SecretKey=${MINIO_PASSWORD:?MINIO_PASSWORD must be set in .env (see deploy/.env.example)}
      - Gpg__KeyDirectory=/app/keys
      - Gpg__PassphraseFile=/run/secrets/lumina_gpg_passphrase
      - Services__BuildService=http://build-service:5001
      # Shared JWT config so security-service can re-validate bearer tokens
      # (defense-in-depth) — see SEC-04. Internal port 5002 is NOT published.
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars; see deploy/.env.example)}
      - Jwt__Issuer=LuminaCI
      - Jwt__Audience=LuminaCI
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - gpg_keys:/app/keys
      - gpg_gnupghome:/app/.gnupg
      - /opt/lumina/builds:/app/builds:z
    secrets:
      - lumina_gpg_passphrase
    security_opt:
      - no-new-privileges:true
      # Compose secrets are bind mounts. Disable SELinux confinement for this
      # container so GnuPG can read the otherwise host-confined secret file.
      - label=disable
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:5002/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lumina-network

  scanner-service:
    image: ${SCANNER_SERVICE_IMAGE:-lumina-scanner-service:local}
    build:
      context: ../
      dockerfile: deploy/docker/Lumina.ScannerService.Dockerfile
    container_name: lumina-scanner-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5003
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=lumina_ci;Username=lumina;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (see deploy/.env.example)}
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=lumina
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env (see deploy/.env.example)}
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_USER:-luminaadmin}
      - MinIO__SecretKey=${MINIO_PASSWORD:?MINIO_PASSWORD must be set in .env (see deploy/.env.example)}
      - Trivy__ServerUrl=http://trivy:8080
      # Shared JWT config so scanner-service can re-validate bearer tokens
      # (defense-in-depth) — see SEC-04. Internal port 5003 is NOT published.
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars; see deploy/.env.example)}
      - Jwt__Issuer=LuminaCI
      - Jwt__Audience=LuminaCI
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    user: "root"
    volumes:
      - /opt/lumina/builds:/app/builds:z
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      trivy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:5003/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lumina-network

  trivy:
    # Pinned: Trivy publishes only X.Y.Z tags (no 0.72 rolling tag exists).
    # Bumping can change the scan-result JSON schema and break
    # ParseTrivyServerResponse — update deliberately and re-test the parser.
    # Keep in sync with deploy/docker/Lumina.ScannerService.Dockerfile (trivy-bin).
    image: aquasec/trivy:0.72.0
    container_name: lumina-trivy
    command: server --listen :8080
    # SEC-01: NOT published to the host. scanner-service connects over
    # lumina-network via `http://trivy:8080` (Trivy__ServerUrl). Publishing
    # exposes an unauthenticated scan API. Inspect via `docker exec` if needed.
    volumes:
      - trivy_cache:/root/.cache/trivy
      - /opt/lumina/builds:/app/builds:z
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lumina-network

  repository-service:
    image: ${REPOSITORY_SERVICE_IMAGE:-lumina-repository-service:local}
    build:
      context: ../
      dockerfile: deploy/docker/Lumina.RepositoryService.Dockerfile
    container_name: lumina-repository-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5004
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=lumina_ci;Username=lumina;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (see deploy/.env.example)}
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=lumina
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env (see deploy/.env.example)}
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_USER:-luminaadmin}
      - MinIO__SecretKey=${MINIO_PASSWORD:?MINIO_PASSWORD must be set in .env (see deploy/.env.example)}
      - Repository__BasePath=/app/repos
      # Shared JWT config so repository-service can re-validate bearer tokens
      # (defense-in-depth) — see SEC-04. Internal port 5004 is NOT published.
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars; see deploy/.env.example)}
      - Jwt__Issuer=LuminaCI
      - Jwt__Audience=LuminaCI
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - repo_data:/app/repos
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:5004/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lumina-network

  source-service:
    image: ${SOURCE_SERVICE_IMAGE:-lumina-source-service:local}
    build:
      context: ../
      dockerfile: deploy/docker/Lumina.SourceService.Dockerfile
    container_name: lumina-source-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5006
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=lumina_ci;Username=lumina;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (see deploy/.env.example)}
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=lumina
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env (see deploy/.env.example)}
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_USER:-luminaadmin}
      - MinIO__SecretKey=${MINIO_PASSWORD:?MINIO_PASSWORD must be set in .env (see deploy/.env.example)}
      - Source__MaxRetries=3
      - Source__FetchTimeoutMinutes=30
      - Source__MaxDownloadBytes=${SOURCE_MAX_DOWNLOAD_BYTES:-1073741824}
      - Source__MaxExpandedBytes=${SOURCE_MAX_EXPANDED_BYTES:-2147483648}
      - Source__MaxStagingBytes=${SOURCE_MAX_STAGING_BYTES:-4294967296}
      - Source__MaxFileCount=${SOURCE_MAX_FILE_COUNT:-100000}
      - Source__MaxCompressionRatio=${SOURCE_MAX_COMPRESSION_RATIO:-100}
      - Source__MaxRedirects=${SOURCE_MAX_REDIRECTS:-5}
      - Source__WorkerConcurrency=${SOURCE_WORKER_CONCURRENCY:-2}
      - Source__WorkerPollSeconds=${SOURCE_WORKER_POLL_SECONDS:-2}
      - Source__LeaseSeconds=${SOURCE_LEASE_SECONDS:-60}
      - Source__TempDir=/tmp/source-fetch
      - Source__SourcesDir=/opt/lumina/sources
      - Services__BuildService=http://build-service:5001
      # Shared JWT config so source-service can re-validate bearer tokens
      # (defense-in-depth) — see SEC-04. Internal port 5006 is NOT published.
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars; see deploy/.env.example)}
      - Jwt__Issuer=LuminaCI
      - Jwt__Audience=LuminaCI
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - source_temp:/tmp/source-fetch
      - /opt/lumina/sources:/opt/lumina/sources:z
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:5006/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lumina-network

  webapp:
    image: ${WEBAPP_IMAGE:-lumina-webapp:local}
    build:
      context: ../
      dockerfile: deploy/docker/Lumina.WebApp.Dockerfile
    container_name: lumina-webapp
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - lumina-network

  # === Build Images (pre-built, used by build-service for RPM containers) ===
  # These build the Docker images and exit — the images are then used by build-service
  # to spin up ephemeral build containers.
  rpm-build-image:
    build:
      context: ../
      dockerfile: deploy/docker/rpm-build.Dockerfile
    image: lumina-rpm-build:f44-v1
    restart: "no"
    entrypoint: ["true"]

  rpm-build-image-aarch64:
    platform: linux/arm64
    build:
      context: ../
      dockerfile: deploy/docker/rpm-build.Dockerfile
    image: ${RPM_AARCH64_BUILD_IMAGE:-lumina-rpm-build:f44-aarch64-v1}
    restart: "no"
    entrypoint: ["true"]

  dotnet-build-image:
    build:
      context: ../
      dockerfile: deploy/docker/dotnet-build.Dockerfile
    image: lumina-dotnet-build:f44-v1
    restart: "no"
    entrypoint: ["true"]

  nginx:
    image: nginx:alpine
    container_name: lumina-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ../deploy/nginx/conf.d:/etc/nginx/conf.d:ro,z
      # TLS certificates for the console vhost (SEC-020). The path is fixed by
      # console.conf: it loads /etc/nginx/certs/console.crt + console.key. Mount
      # a host directory (or a docker secret / named volume) containing those
      # two files; nginx refuses to start without them, which is intentional.
      # For local dev, generate a self-signed pair:
      #   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
      #     -keyout console.key -out console.crt -subj "/CN=console.lumina.1t.ru"
      # and put both files in ../deploy/nginx/certs/.
      - ../deploy/nginx/certs:/etc/nginx/certs:ro,z
      - repo_data:/srv/packages:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      webapp:
        condition: service_healthy
    networks:
      - lumina-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  gpg_keys:
  gpg_gnupghome:
  trivy_cache:
  repo_data:
  source_temp:

secrets:
  lumina_gpg_passphrase:
    file: ${GPG_PASSPHRASE_FILE:?GPG_PASSPHRASE_FILE must point to the signing passphrase secret}

networks:
  lumina-network:
    driver: bridge
  # Dedicated bridge for untrusted build containers. It is intentionally a
  # SEPARATE network from lumina-network: build containers (rpm-build, dotnet-build)
  # are attached here so they cannot reach Postgres/RabbitMQ/MinIO/Trivy/other
  # services directly — they only get outbound internet (for dnf builddep / git
  # clone) and a path back to build-service via build-service's own attachment.
  lumina-buildnet:
    name: ${BUILD_NETWORK:-lumina-buildnet}
    driver: bridge
  # Two-party network: only build-service and docker-socket-proxy. Isolates the
  # socket-exposing proxy from every other service.
  proxy-net:
    driver: bridge
