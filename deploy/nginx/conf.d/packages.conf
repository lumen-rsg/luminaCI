# packages.lumina.1t.ru — Package mirror
server {
    listen 80;
    server_name packages.lumina.1t.ru;

    # Security headers for packages site
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Controlled dependency origin for Kubernetes build pods. The pod network
    # policy permits only this vhost's /32 on TCP 443 plus cluster DNS.
    location ^~ /fedora/ {
        limit_except GET { deny all; }
        set $fedora_origin https://dl.fedoraproject.org;
        rewrite ^/fedora/(.*)$ /pub/fedora/linux/$1 break;
        proxy_pass $fedora_origin;
        proxy_ssl_server_name on;
        proxy_ssl_name dl.fedoraproject.org;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header Host dl.fedoraproject.org;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
    }

    # Presigned snapshot capabilities are read-only. Keep the original Host and
    # request target intact because both are covered by the S3 signature.
    location ^~ /lumina-sources/ {
        limit_except GET { deny all; }
        set $minio_origin http://minio:9000;
        proxy_pass $minio_origin;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 1800s;
    }

    # Runner capabilities can upload or download one short-lived, explicitly
    # signed artifact object. MinIO still rejects unsigned requests and bucket
    # enumeration; nginx only provides the controlled HTTPS transport boundary.
    location ^~ /lumina-artifacts/ {
        limit_except GET PUT { deny all; }
        client_max_body_size 0;
        set $minio_origin http://minio:9000;
        proxy_pass $minio_origin;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # Publication staging and superseded metadata live on the same volume so
    # renameat2 can swap them atomically. Never expose hidden paths over nginx.
    location ~ (^|/)\. {
        return 404;
    }

    # Public package portal. Only the explicit application surface is proxied;
    # repository paths below remain direct nginx file transfers.
    location = / {
        set $packages_web http://packages-web:80;
        proxy_pass $packages_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        set $packages_web http://packages-web:80;
        proxy_pass $packages_web;
        proxy_set_header Host $host;
        expires 1y;
    }

    location ~ ^/(favicon\.svg|site\.webmanifest|lumina\.repo|RPM-GPG-KEY-lumina)$ {
        set $packages_web http://packages-web:80;
        proxy_pass $packages_web;
        proxy_set_header Host $host;
    }

    location = /api/package-index {
        return 308 /api/package-index/;
    }

    location /api/package-index/ {
        limit_except GET { deny all; }
        alias /srv/packages/var/lib/lumina/repositories/;
        autoindex on;
        autoindex_format json;
        autoindex_exact_size on;
        autoindex_localtime off;
    }

    location = /lumen {
        return 308 /lumen/;
    }

    location ^~ /lumen/ {
        limit_except GET { deny all; }
        alias /srv/packages/var/lib/lumina/repositories/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        default_type application/octet-stream;
    }

    # Preserve the legacy direct volume paths for existing installations.
    location / {
        limit_except GET { deny all; }
        alias /srv/packages/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        default_type application/octet-stream;
    }

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
