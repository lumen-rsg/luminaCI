# packages.lumina.1t.ru — Package mirror
server {
    listen 80;
    server_name packages.lumina.1t.ru;

    # Security headers for packages site
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;

    # Publication staging and superseded metadata live on the same volume so
    # renameat2 can swap them atomically. Never expose hidden paths over nginx.
    location ~ (^|/)\. {
        return 404;
    }

    # Serve RPM repositories from volume
    location / {
        alias /srv/packages/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # RPM repository headers
        add_header Content-Type "text/plain" always;
    }

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
