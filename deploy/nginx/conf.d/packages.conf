# packages.lumina.1t.ru — Package mirror
server {
    listen 80;
    server_name packages.lumina.1t.ru;

    # Security headers for packages site
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;

    # Controlled dependency origin for Kubernetes build pods. The pod network
    # policy permits only this vhost's /32 on TCP 443 plus cluster DNS.
    location ^~ /fedora/ {
        limit_except GET { deny all; }
        set $fedora_origin https://dl.fedoraproject.org;
        rewrite ^/fedora/(.*)$ /pub/fedora/linux/$1 break;
        proxy_pass $fedora_origin;
        proxy_ssl_server_name on;
        proxy_ssl_name dl.fedoraproject.org;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header Host dl.fedoraproject.org;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
    }

    # Presigned snapshot capabilities are read-only. Keep the original Host and
    # request target intact because both are covered by the S3 signature.
    location ^~ /lumina-sources/ {
        limit_except GET { deny all; }
        set $minio_origin http://minio:9000;
        proxy_pass $minio_origin;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 1800s;
    }

    # Runner capabilities can upload one short-lived artifact bundle but can
    # neither enumerate nor download the private artifact bucket.
    location ^~ /lumina-artifacts/ {
        limit_except PUT { deny all; }
        set $minio_origin http://minio:9000;
        proxy_pass $minio_origin;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # Publication staging and superseded metadata live on the same volume so
    # renameat2 can swap them atomically. Never expose hidden paths over nginx.
    location ~ (^|/)\. {
        return 404;
    }

    # Serve RPM repositories from volume
    location / {
        alias /srv/packages/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # RPM repository headers
        add_header Content-Type "text/plain" always;
    }

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
