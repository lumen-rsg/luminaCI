# packages.lumina.1t.ru — Package mirror
server {
    listen 80;
    server_name packages.lumina.1t.ru;

    # Serve RPM repositories from volume
    location / {
        alias /srv/packages/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # RPM repository headers
        add_header Content-Type "text/plain" always;
    }

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}