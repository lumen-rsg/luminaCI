# console.lumina.1t.ru — Web UI + API Gateway
#
# TLS termination lives HERE in nginx (SEC-020). The compose file publishes
# both 80 and 443; this file:
#   • listens on 443 with ssl + http2 and serves the full app over HTTPS,
#   • keeps a :80 server only to redirect every request to HTTPS.
# Provider webhook tokens (e.g. GitLab X-Gitlab-Token) and JWT session
# cookies (Secure, set via Jwt__CookieSecure) are only protected in transit
# when the edge is HTTPS — without termination here they traveled as
# plaintext over the wire even though the cookie flag was on.
#
# Cert/key are read-only mounted at /etc/nginx/certs/ (see docker-compose.yml
# nginx service). The filenames are fixed so nginx starts deterministically:
#   /etc/nginx/certs/console.crt   (fullchain)
#   /etc/nginx/certs/console.key   (private key, mode 0400)
# Provision these out-of-band (Let's Encrypt, an internal CA, or a self-signed
# cert for dev) — the compose service will fail to start if they are absent,
# which is intentional: serving on :443 with no cert is worse than not serving.

# Docker embedded DNS — forces nginx to re-resolve on every request
# instead of caching the IP forever at startup.
resolver 127.0.0.11 valid=30s ipv6=off;

# Plain-HTTP server: redirect everything to HTTPS. There is intentionally no
# app traffic served from :80; only health probes bypass the redirect.
server {
    listen 80 default_server;
    server_name console.lumina.1t.ru localhost;

    # nginx's own health probe / readiness check stays cheap on HTTP.
    location = /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Application startup/liveness/readiness probes → API Gateway.
    location /health/ {
        set $api_gateway http://api-gateway:5000;
        proxy_pass $api_gateway;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        # Use 308 so the redirect is cached and the method/body are preserved.
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name console.lumina.1t.ru localhost;

    # Expose API Gateway probe results without requiring authentication.
    location /health/ {
        set $api_gateway http://api-gateway:5000;
        proxy_pass $api_gateway;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # TLS. Modern server list only — the weak ciphers/protocols are absent.
    # TLSv1.0/1.1 are disabled; the build UI and webhook senders (GitHub/GitLab/
    # Forgejo) all negotiate TLSv1.2/1.3.
    ssl_certificate     /etc/nginx/certs/console.crt;
    ssl_certificate_key /etc/nginx/certs/console.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # OCSP stapling — hides client IP from the CA and speeds up the handshake.
    ssl_stapling on;
    ssl_stapling_verify on;

    # React ships only external, content-hashed scripts and styles, so the
    # console does not require inline-script, inline-style, or WASM exceptions.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS — only valid over HTTPS. 1 year + preload; tighten once you have
    # certs for every host and intend to enforce HTTPS permanently. For now
    # preload is omitted (don't ask the HSTS preload list until you're sure).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # SSE build log streaming — needs disabled buffering for real-time delivery
    location ~ ^/api/builds/[^/]+/logs/stream$ {
        set $api_gateway http://api-gateway:5000;
        proxy_pass $api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE requires no buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Long timeout for streaming connections
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Chunked transfer encoding
        chunked_transfer_encoding on;
    }

    # API requests → API Gateway
    location /api/ {
        set $api_gateway http://api-gateway:5000;
        proxy_pass $api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large file uploads (extra sources, packages)
        client_max_body_size 0;

        # Timeouts — give backend enough time for slow operations / large uploads
        proxy_connect_timeout 30s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;

        # SignalR WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SignalR negotiations
    location /hubs/ {
        set $api_gateway http://api-gateway:5000;
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # index.html is never cached so deploys immediately reference the newest
    # content-hashed React assets. Location-level headers must repeat the server
    # headers because nginx does not inherit add_header when one is set here.
    location = /index.html {
        set $webapp http://webapp:80;
        proxy_pass $webapp;
        proxy_set_header Accept-Encoding "";

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # React single-page application → WebApp container
    location / {
        set $webapp http://webapp:80;
        proxy_pass $webapp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent double compression between the two nginx layers.
        proxy_set_header Accept-Encoding "";
    }
}
