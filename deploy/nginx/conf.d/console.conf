# console.lumina.1t.ru — Web UI + API Gateway

# Docker embedded DNS — forces nginx to re-resolve on every request
# instead of caching the IP forever at startup.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80 default_server;
    server_name console.lumina.1t.ru localhost;

    # API requests → API Gateway
    location /api/ {
        set $api_gateway http://api-gateway:5000;
        proxy_pass $api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SignalR WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # SignalR negotiations
    location /hubs/ {
        set $api_gateway http://api-gateway:5000;
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Blazor WebAssembly → WebApp container
    location / {
        set $webapp http://webapp:80;
        proxy_pass $webapp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
