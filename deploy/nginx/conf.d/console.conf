# console.lumina.1t.ru — Web UI + API Gateway

# Docker embedded DNS — forces nginx to re-resolve on every request
# instead of caching the IP forever at startup.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80 default_server;
    server_name console.lumina.1t.ru localhost;

    # Security headers.
    #
    # Content-Security-Policy uses a per-request nonce ($request_id). The SAME
    # nonce is injected into index.html's inline <script type="importmap"> tag
    # by sub_filter below, so .NET 10 Blazor's importmap is the ONLY inline
    # script the page is allowed to run — 'unsafe-inline' is gone from
    # script-src (SEC-05). All other client JS lives in /js/app.js ('self').
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Inject the per-request nonce into the importmap tag of index.html.
    # Applies (via inheritance) to every proxied location that serves HTML.
    sub_filter "__CSP_NONCE__" "$request_id";
    sub_filter_once off;
    sub_filter_types text/html;

    # SSE build log streaming — needs disabled buffering for real-time delivery
    location ~ ^/api/builds/[^/]+/logs/stream$ {
        set $api_gateway http://api-gateway:5000;
        proxy_pass $api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE requires no buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Long timeout for streaming connections
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Chunked transfer encoding
        chunked_transfer_encoding on;
    }

    # API requests → API Gateway
    location /api/ {
        set $api_gateway http://api-gateway:5000;
        proxy_pass $api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large file uploads (extra sources, packages)
        client_max_body_size 0;

        # Timeouts — give backend enough time for slow operations / large uploads
        proxy_connect_timeout 30s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;

        # SignalR WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SignalR negotiations
    location /hubs/ {
        set $api_gateway http://api-gateway:5000;
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # index.html — never cache (always fetch fresh Blazor boot info + nonce).
    #
    # This is the only HTML response, so the per-request CSP nonce ($request_id)
    # and the sub_filter injection MUST apply here. nginx drops server-level
    # add_header when a location has its own add_header, so the security headers
    # are re-declared explicitly (with the nonce) below.
    location = /index.html {
        set $webapp http://webapp:80;
        proxy_pass $webapp;
        # Disable upstream compression so sub_filter can rewrite the body and
        # inject the nonce into the <script type="importmap"> tag.
        proxy_set_header Accept-Encoding "";

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Blazor WebAssembly → WebApp container
    location / {
        set $webapp http://webapp:80;
        proxy_pass $webapp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent upstream nginx (webapp) from gzipping — avoid double-encoding
        # and keep sub_filter (nonce injection) effective for any HTML served.
        proxy_set_header Accept-Encoding "";
    }
}
