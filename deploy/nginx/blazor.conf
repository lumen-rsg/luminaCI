server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy — forward to API Gateway
    location /api/ {
        proxy_pass http://lumina-api-gateway:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Blazor WASM routing - fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Blazor framework files — MUST come before the generic extension block below.
    # nginx evaluates regex locations in document order (first match wins), and
    # _framework/*.js would otherwise be caught by the *.js rule. These files ARE
    # content-fingerprinted (dotnet.<hash>.js, blazor.webassembly.<hash>.js,
    # *.wasm...), so a given filename genuinely never changes its bytes.
    # `immutable` + 1 year is safe and optimal here.
    location ~* _framework/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Non-fingerprinted wwwroot assets (app.css, app.js, bootstrap, images).
    # These change across deploys but keep the same URL, so they MUST be allowed
    # to revalidate — never mark them `immutable`, or a browser that cached a
    # pre-overhaul app.css will keep serving it for a year and ignore fixes
    # (e.g. the .app-icon rules that the inline-SVG icons depend on). A short
    # max-age with must-revalidate makes the browser check ETag/Last-Modified.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Don't cache index.html or service-worker
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/wasm;
    gzip_min_length 256;
}