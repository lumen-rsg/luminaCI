apiVersion: v1
kind: Namespace
metadata:
  name: lumina-builds
  labels:
    app.kubernetes.io/managed-by: lumina-ci
    # Fedora dependency installation runs as container-root inside a Kubernetes
    # user namespace (hostUsers: false). Baseline permits the small, explicit
    # namespaced capability set while still rejecting host-level privileges.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lumina-build-controller
  namespace: lumina-builds
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lumina-build-runner
  namespace: lumina-builds
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lumina-build-controller
  namespace: lumina-builds
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lumina-build-controller
  namespace: lumina-builds
subjects:
  - kind: ServiceAccount
    name: lumina-build-controller
    namespace: lumina-builds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lumina-build-controller
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: lumina-builds
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lumina-build-quota
  namespace: lumina-builds
spec:
  hard:
    count/jobs.batch: "16"
    count/secrets: "16"
    pods: "20"
    requests.cpu: "8"
    requests.memory: 16Gi
    requests.ephemeral-storage: 64Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    limits.ephemeral-storage: 256Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: lumina-build-limits
  namespace: lumina-builds
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 500m
        memory: 1Gi
        ephemeral-storage: 4Gi
      default:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 16Gi
      max:
        cpu: "8"
        memory: 16Gi
        ephemeral-storage: 64Gi
